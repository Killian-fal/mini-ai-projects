[project]
name = "duplicate-finder"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "ag-ui-protocol>=0.1.18",
    "agno[lmstudio,os,opentelemetry,lancedb,sqlite,pylance]>=2.6.4",
    "imagehash>=4.3.2",
    "openai>=2.33.0",
    "pillow>=12.2.0",
    "pillow-heif>=1.3.0",
    "torch>=2.4",
    "torchvision>=0.26.0",
    "transformers>=4.49.0",
]

[project.scripts]
app = "duplicate_finder.app:run"

[build-system]
requires = ["uv_build>=0.8.0,<0.9"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.15.12",
]
