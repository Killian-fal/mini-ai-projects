services:
  mongo:
    image: mongo:8
    ports: ["27017:27017"]
    volumes: ["mongo:/data/db"]
  mongo-express:
    image: mongo-express:1
    ports: ["8081:8081"]
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://mongo:27017
      ME_CONFIG_BASICAUTH: "false"
    depends_on: [mongo]
volumes:
  mongo:
    name: job_mongo
