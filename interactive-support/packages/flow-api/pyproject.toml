[project]
name = "interactive-support-flow-api"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "dspy[typesafe]>=3.4.0",
    "pydantic>=2.13.5",
]

[project.entry-points."interactive_support.locales"]
question = "interactive_support_flow_api.model.question"

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"
