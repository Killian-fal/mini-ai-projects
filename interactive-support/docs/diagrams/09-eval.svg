<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="DESCRIPTION" style="width:1114px;height:157px;background:#FFFFFF;" width="1114px" height="157px" viewBox="0 0 1114 157" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.8?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><!--entity CASES--><g class="entity" data-qualified-name="CASES" id="ent0001" data-source-line="16"><rect x="6" y="44.5" width="175.321" height="66" fill="#FFF1B8" style="stroke:#B8901C;stroke-width:0.5;" rx="6" ry="6"/><text x="16" y="64.51" fill="#222" font-size="13" textLength="62.861" font-family="Helvetica">Eval cases</text><text x="16" y="75.97" fill="#222" font-size="11" textLength="127.784" font-family="Helvetica">TOML files, one per group</text><text x="16" y="86.97" fill="#222" font-size="11" textLength="155.321" font-family="Helvetica">written and labelled by a human</text><text x="16" y="97.97" fill="#222" font-size="11" textLength="45.853" font-family="Helvetica">in French</text></g><!--entity RUN--><g class="entity" data-qualified-name="RUN" id="ent0002" data-source-line="17"><rect x="271" y="12" width="158.741" height="55" fill="#DCE8FB" style="stroke:#3D6DB5;stroke-width:0.5;" rx="6" ry="6"/><text x="281" y="32.01" fill="#222" font-size="13" textLength="138.741" font-family="Helvetica">The real step of the flow</text><text x="281" y="43.47" fill="#222" font-size="11" textLength="102.104" font-family="Helvetica">e.g. is_service_issue</text><text x="281" y="54.47" fill="#222" font-size="11" textLength="88.655" font-family="Helvetica">real call, cache off</text></g><!--entity CRITERIA--><g class="entity" data-qualified-name="CRITERIA" id="ent0003" data-source-line="18"><rect x="500" y="44.5" width="158.805" height="66" fill="#DDF3D8" style="stroke:#4E8F48;stroke-width:0.5;" rx="6" ry="6"/><text x="510" y="64.51" fill="#222" font-size="13" textLength="41.895" font-family="Helvetica">Criteria</text><text x="510" y="75.97" fill="#222" font-size="11" textLength="109.452" font-family="Helvetica">named checks in code</text><text x="510" y="86.97" fill="#222" font-size="11" textLength="129.621" font-family="Helvetica">equality, normalized fields,</text><text x="510" y="97.97" fill="#222" font-size="11" textLength="138.805" font-family="Helvetica">expected or forbidden words</text></g><!--entity REPORT--><g class="entity" data-qualified-name="REPORT" id="ent0004" data-source-line="19"><rect x="696" y="39" width="147.182" height="77" fill="#F2EDE4" style="stroke:#9A8763;stroke-width:0.5;" rx="6" ry="6"/><text x="706" y="59.01" fill="#222" font-size="13" textLength="39.019" font-family="Helvetica">Report</text><text x="706" y="70.47" fill="#222" font-size="11" textLength="117.713" font-family="Helvetica">score + 95% confidence</text><text x="706" y="81.47" fill="#222" font-size="11" textLength="78.848" font-family="Helvetica">interval (Wilson)</text><text x="706" y="92.47" fill="#222" font-size="11" textLength="114.334" font-family="Helvetica">per criterion, per group,</text><text x="706" y="103.47" fill="#222" font-size="11" textLength="127.182" font-family="Helvetica">each failure with its output</text></g><!--entity MLFLOW--><g class="entity" data-qualified-name="MLFLOW" id="ent0005" data-source-line="20"><rect x="927" y="13" width="123.941" height="55" fill="#F2EDE4" style="stroke:#9A8763;stroke-width:0.5;" rx="6" ry="6"/><text x="937" y="33.01" fill="#222" font-size="13" textLength="41.177" font-family="Helvetica">MLflow</text><text x="937" y="44.47" fill="#222" font-size="11" textLength="82.554" font-family="Helvetica">one run per eval,</text><text x="937" y="55.47" fill="#222" font-size="11" textLength="103.941" font-family="Helvetica">the traces of the calls</text></g><!--entity DEV--><g class="entity" data-qualified-name="DEV" id="ent0006" data-source-line="21"><rect x="880" y="86" width="218.107" height="55" fill="#FFF1B8" style="stroke:#B8901C;stroke-width:0.5;" rx="6" ry="6"/><text x="890" y="106.01" fill="#222" font-size="13" textLength="59.255" font-family="Helvetica">Developer</text><text x="890" y="117.47" fill="#222" font-size="11" textLength="198.107" font-family="Helvetica">reads the failures, improves the question</text><text x="890" y="128.47" fill="#222" font-size="11" textLength="149.193" font-family="Helvetica">or the prompt, never the labels</text></g><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk7" data-link-type="dependency"><polygon points="270.763,51.233,261.272,48.604,265.818,51.97,262.451,56.516,270.763,51.233" fill="#555" style="stroke:#555;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M181.187,64.582 C210.208,60.257 237.438,56.199 265.818,51.97" style="stroke:#555;stroke-width:1.2;" fill="none"/><text x="201" y="49.97" fill="#444" font-size="11" textLength="50.762" font-family="Helvetica">each input</text></g><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" id="lnk8" data-link-type="dependency"><polygon points="499.883,64.339,491.667,58.908,494.951,63.514,490.346,66.799,499.883,64.339" fill="#555" style="stroke:#555;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M430.257,52.684 C452.794,56.457 472.422,59.743 494.951,63.514" style="stroke:#555;stroke-width:1.2;" fill="none"/><text x="450" y="51.97" fill="#444" font-size="11" textLength="30.583" font-family="Helvetica">output</text></g><g class="link" data-entity-1="ent0001" data-entity-2="ent0003" id="lnk9" data-link-type="dependency"><polygon points="499.988,86.291,490.649,83.163,495.01,86.765,491.408,91.127,499.988,86.291" fill="#555" style="stroke:#555;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M181.05,85.739 C209.658,88.095 241.668,90.339 271,91.5 C341.611,94.296 359.411,94.82 430,91.5 C452.763,90.429 472.446,88.915 495.01,86.765" style="stroke:#555;stroke-width:1.2;" fill="none"/><text x="328.5" y="86.97" fill="#444" font-size="11" textLength="44.645" font-family="Helvetica">expected</text></g><g class="link" data-entity-1="ent0003" data-entity-2="ent0004" id="lnk10" data-link-type="dependency"><polygon points="695.877,77.5,686.877,73.5,690.877,77.5,686.877,81.5,695.877,77.5" fill="#555" style="stroke:#555;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M659.14,77.5 C671.315,77.5 678.843,77.5 690.877,77.5" style="stroke:#555;stroke-width:1.2;" fill="none"/></g><g class="link" data-entity-1="ent0004" data-entity-2="ent0005" id="lnk11" data-link-type="dependency"><polygon points="926.955,50.885,917.412,48.451,922.026,51.723,918.754,56.337,926.955,50.885" fill="#555" style="stroke:#555;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M843.227,65.128 C870.395,60.506 896.016,56.148 922.026,51.723" style="stroke:#555;stroke-width:1.2;" fill="none"/></g><g class="link" data-entity-1="ent0004" data-entity-2="ent0006" id="lnk12" data-link-type="dependency"><polygon points="879.676,95.571,871.45,90.155,874.743,94.754,870.144,98.047,879.676,95.571" fill="#555" style="stroke:#555;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M843.227,89.538 C854.959,91.479 862.388,92.709 874.743,94.754" style="stroke:#555;stroke-width:1.2;" fill="none"/></g><?plantuml-src TLJRJjj047ttLqmH5QqQg7ZeGr4KAO2fK1s2ahIyL8gMzJXUiTurUqa8LV-zipQN3JPFYUPoPkQSipw0gKB0DPCdKFgAAU3CeXs0An4CCWdMOGswQ0A5r1lG2fpEsVR0GgLpb0FW9V8x2uAQAJ001fPhWx0HhWJXB7Z5qJWcbDic7uJYqkS8I-ks4e-4hsGYiN242aQiIWUvCCYTq2gnTqBLpB0AGeIfbKJucm2SCdwtCjgh_4nBRM1_laYlbwS_GagR74qSpYwlqcxFSDZSEnh1_dZ-izFx9lqUXfHLACcoIGz2b7olFsUEXPhpyMBSWx2JRZ3-9QKWyaWLWzfjQqoILshsKXAoLV2F6bhnY2V7nwF5T9918MIGLPFQDHe8IzJ3hw5a59LkZ70E5J2LWsItA2NcSBibHHiskWsa-OL1nSkdr1wy4iSid8tdwJnUSF6UhI9CF5eTWR1BYsOjE2w5jHwxeniOpcGm82CB4beHRT6IJplCVbt56vpHYMW4Yv0Kg-ZCNHTtv-6zPrAuxG2KDXNzVQIcGg3CxQ2d-g6ccLH1DYoqkHLvJhnkI5pxicGWQ7QvI6UNutZ36TRQk0YhVKrVuFktZxIRAiW0zA3wnA3BWWC-tGXfjVhSBGdQyvO1hGQlLkYxW4Y5WWdfuwUilQk