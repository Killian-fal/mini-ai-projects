<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="STATE" style="width:842px;height:696px;background:#FFFFFF;" width="842px" height="696px" viewBox="0 0 842 696" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.8?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="entity" data-qualified-name="FIRST" id="ent0001" data-source-line="16"><rect x="608" y="87" width="196.134" height="53" fill="#DCE8FB" style="stroke:#3D6DB5;stroke-width:0.5;" rx="6" ry="6"/><line x1="608" y1="108" x2="804.134" y2="108" style="stroke:#3D6DB5;stroke-width:0.5;"/><text x="643.094" y="100.47" fill="#666" font-size="11" textLength="125.947" font-family="Helvetica">Analyze the first message</text><text x="613" y="121.47" fill="#666" font-size="11" textLength="176.134" font-style="italic" font-family="Helvetica">one call: the language and the issue</text><text x="613" y="132.47" fill="#666" font-size="11" textLength="152.249" font-style="italic" font-family="Helvetica">the number: regular expression</text></g><g class="entity" data-qualified-name="CANDIDATES" id="ent0002"><polygon points="706,177,718,189,706,201,694,189,706,177" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><g class="entity" data-qualified-name="CONFIRM" id="ent0003" data-source-line="18"><rect x="107.5" y="263" width="223.312" height="50" fill="#FFF1B8" style="stroke:#B8901C;stroke-width:0.5;" rx="6" ry="6"/><line x1="107.5" y1="284" x2="330.812" y2="284" style="stroke:#B8901C;stroke-width:0.5;"/><text x="176.362" y="276.47" fill="#666" font-size="11" textLength="85.588" font-family="Helvetica">Confirm the issue</text><text x="112.5" y="297.47" fill="#666" font-size="11" textLength="203.312" font-style="italic" font-family="Helvetica">choice: the candidates + “something else”</text></g><g class="entity" data-qualified-name="DESCRIBE" id="ent0004" data-source-line="19"><rect x="617" y="364" width="178.372" height="53" fill="#FFF1B8" style="stroke:#B8901C;stroke-width:0.5;" rx="6" ry="6"/><line x1="617" y1="385" x2="795.372" y2="385" style="stroke:#B8901C;stroke-width:0.5;"/><text x="660.943" y="377.47" fill="#666" font-size="11" textLength="90.487" font-family="Helvetica">Describe the issue</text><text x="622" y="398.47" fill="#666" font-size="11" textLength="158.372" font-style="italic" font-family="Helvetica">free text, then one call: the issue</text><text x="622" y="409.47" fill="#666" font-size="11" textLength="107.003" font-style="italic" font-family="Helvetica">the number, if present</text></g><g class="entity" data-qualified-name="NUMBER_KNOWN" id="ent0005"><polygon points="219,378.5,231,390.5,219,402.5,207,390.5,219,378.5" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><g class="entity" data-qualified-name="NUMBER" id="ent0006" data-source-line="21"><rect x="6" y="468" width="174.081" height="50" fill="#FFF1B8" style="stroke:#B8901C;stroke-width:0.5;" rx="6" ry="6"/><line x1="6" y1="489" x2="180.081" y2="489" style="stroke:#B8901C;stroke-width:0.5;"/><text x="32.207" y="481.47" fill="#666" font-size="11" textLength="121.666" font-family="Helvetica">Ask for the order number</text><text x="11" y="502.47" fill="#666" font-size="11" textLength="154.081" font-style="italic" font-family="Helvetica">text, read by regular expression</text></g><g class="entity" data-qualified-name="FLOW" id="ent0007" data-source-line="22"><rect x="231.5" y="569" width="137.353" height="50" fill="#DDF3D8" style="stroke:#4E8F48;stroke-width:0.5;" rx="6" ry="6"/><line x1="231.5" y1="590" x2="368.853" y2="590" style="stroke:#4E8F48;stroke-width:0.5;"/><text x="261.223" y="582.47" fill="#666" font-size="11" textLength="77.908" font-family="Helvetica">The issue's flow</text><text x="236.5" y="603.47" fill="#666" font-size="11" textLength="117.353" font-style="italic" font-family="Helvetica">CANCEL, DAMAGED…</text></g><g class="start_entity" data-qualified-name=".start." id="ent0008" data-source-line="24"><ellipse cx="706" cy="22" rx="10" ry="10" fill="#222" style="stroke:#222;stroke-width:1;"/></g><g class="end_entity" data-qualified-name=".end." id="ent0020" data-source-line="35"><ellipse cx="300" cy="667" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="300" cy="667" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/></g><g class="entity" data-qualified-name="GMN22" id="ent0023" data-source-line="38"><path d="M348.5,271 L348.5,284 L330.582,288 L348.5,292 L348.5,305 A6,6 0 0 0 354.5,311 L663.67,311 A6,6 0 0 0 669.67,305 L669.67,275 L659.67,265 L354.5,265 A6,6 0 0 0 348.5,271" style="stroke:#C8B45A;stroke-width:0.5;" fill="#FFFBEA"/><path d="M659.67,265 L659.67,272 A3,3 0 0 0 662.67,275 L669.67,275 L659.67,265" style="stroke:#C8B45A;stroke-width:0.5;" fill="#FFFBEA"/><text x="354.5" y="279.24" fill="#222" font-size="12" textLength="284.854" font-family="Helvetica">Even when confident, the model never decides alone:</text><text x="354.5" y="291.24" fill="#222" font-size="12" textLength="219.41" font-family="Helvetica">the customer always confirms their issue.</text><text x="354.5" y="303.24" fill="#222" font-size="12" textLength="300.17" font-family="Helvetica">Uncertainty only changes the number of choices offered.</text></g><g class="entity" data-qualified-name="GMN25" id="ent0026" data-source-line="43"><path d="M585.5,482 L585.5,504 A6,6 0 0 0 591.5,510 L820.637,510 A6,6 0 0 0 826.637,504 L826.637,486 L816.637,476 L710,476 L706,417.12 L702,476 L591.5,476 A6,6 0 0 0 585.5,482" style="stroke:#C8B45A;stroke-width:0.5;" fill="#FFFBEA"/><path d="M816.637,476 L816.637,483 A3,3 0 0 0 819.637,486 L826.637,486 L816.637,476" style="stroke:#C8B45A;stroke-width:0.5;" fill="#FFFBEA"/><text x="591.5" y="490.24" fill="#222" font-size="12" textLength="220.137" font-family="Helvetica">No way out other than choosing an issue:</text><text x="591.5" y="502.24" fill="#222" font-size="12" textLength="172.107" font-family="Helvetica">there is no human handover yet.</text></g><g class="link" data-entity-1="ent0008" data-entity-2="ent0001" id="lnk9" data-link-type="dependency"><polygon points="706,86.849,710,77.849,706,81.849,702,77.849,706,86.849" fill="#555" style="stroke:#555;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M706,36.082 C706,48.774 706,64.989 706,81.849" style="stroke:#555;stroke-width:1.2;" fill="none"/><text x="708" y="64.47" fill="#444" font-size="11" textLength="65.409" font-family="Helvetica">first message</text></g><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk10" data-link-type="dependency"><polygon points="706,176.976,710,167.976,706,171.976,702,167.976,706,176.976" fill="#555" style="stroke:#555;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M706,140.207 C706,152.791 706,162.281 706,171.976" style="stroke:#555;stroke-width:1.2;" fill="none"/></g><g class="link" data-entity-1="ent0004" data-entity-2="ent0002" id="lnk11" data-link-type="dependency"><polygon points="718.007,197.925,723.039,206.391,722.087,200.815,727.664,199.863,718.007,197.925" fill="#555" style="stroke:#555;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M738.755,363.696 C753.096,350.3 768.373,332.633 776,313 C784.047,292.286 784.288,283.619 776,263 C764.277,233.838 738.805,212.657 722.087,200.815" style="stroke:#555;stroke-width:1.2;" fill="none"/></g><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" id="lnk12" data-link-type="dependency"><polygon points="308.681,262.933,318.394,264.562,313.523,261.686,316.398,256.815,308.681,262.933" fill="#555" style="stroke:#555;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M693.858,191.29 C661.936,194.772 573.08,205.048 500,219 C435.537,231.307 368.463,247.533 313.523,261.686" style="stroke:#555;stroke-width:1.2;" fill="none"/><text x="503.104" y="229.47" fill="#444" font-size="11" textLength="186.42" font-family="Helvetica">confidence ≥ 0.7: the most likely alone</text><text x="502" y="240.47" fill="#444" font-size="11" textLength="188.627" font-family="Helvetica">otherwise: all those with probability > 0</text></g><g class="link" data-entity-1="ent0002" data-entity-2="ent0004" id="lnk13" data-link-type="dependency"><polygon points="706,363.87,710,354.87,706,358.87,702,354.87,706,363.87" fill="#555" style="stroke:#555;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M706,201.01 C706,231.887 706,314.911 706,358.87" style="stroke:#555;stroke-width:1.2;" fill="none"/><text x="708" y="285.47" fill="#444" font-size="11" textLength="62.998" font-family="Helvetica">no candidate</text><text x="719.636" y="296.47" fill="#444" font-size="11" textLength="39.725" font-family="Helvetica">(“other”)</text></g><g class="link" data-entity-1="ent0003" data-entity-2="ent0004" id="lnk14" data-link-type="dependency"><polygon points="616.723,371.076,608.717,365.34,611.826,370.066,607.1,373.175,616.723,371.076" fill="#555" style="stroke:#555;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M330.728,312.057 C417.501,329.964 531.325,353.453 611.826,370.066" style="stroke:#555;stroke-width:1.2;" fill="none"/><text x="494" y="341.47" fill="#444" font-size="11" textLength="81.313" font-family="Helvetica">“something else”</text></g><g class="link" data-entity-1="ent0003" data-entity-2="ent0005" id="lnk15" data-link-type="dependency"><polygon points="219,378.296,223,369.296,219,373.296,215,369.296,219,378.296" fill="#555" style="stroke:#555;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M219,313.072 C219,333.745 219,357.62 219,373.296" style="stroke:#555;stroke-width:1.2;" fill="none"/><text x="221" y="341.47" fill="#444" font-size="11" textLength="64.206" font-family="Helvetica">issue chosen</text></g><g class="link" data-entity-1="ent0005" data-